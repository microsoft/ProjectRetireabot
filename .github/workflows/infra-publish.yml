name: Publish Infrastructure Template

on:
  push:
    branches: [main]

concurrency:
  group: publish-infrastructure-template
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ARM template
        run: az bicep build --file infra/main.bicep --outfile "${{ runner.temp }}/main.json"

      - name: Generate template version
        id: version
        shell: bash
        run: |
          commit_date="$(git show -s --format=%cs "$GITHUB_SHA")"
          echo "value=v${commit_date//-/.}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: publish
          path: published

      - name: Publish template
        working-directory: published
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          version_path="versions/$VERSION/main.json"

          if [[ -f "$version_path" ]] && ! cmp --silent "${{ runner.temp }}/main.json" "$version_path"; then
            echo "::error::Published version $VERSION already exists with different content."
            exit 1
          fi

          mkdir -p latest "versions/$VERSION"
          cp "${{ runner.temp }}/main.json" latest/main.json
          cp "${{ runner.temp }}/main.json" "$version_path"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest/main.json "$version_path"

          if git diff --cached --quiet; then
            echo "Template $VERSION is already published."
            exit 0
          fi

          git commit -m "Publish infrastructure template $VERSION"
          git push origin HEAD:publish
